services:
  - type: web
    name: osmosify
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm ci && npm run build && npm run db:push
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: osmosify-db
          property: connectionString
      # Google OAuth — fill these in via the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      # Cloudflare R2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: PUBLIC_OBJECT_PREFIX
        value: public
      - key: PRIVATE_OBJECT_PREFIX
        value: private
      # Gemini (direct)
      - key: GEMINI_API_KEY
        sync: false
      # Twilio (phone auth — optional)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

databases:
  - name: osmosify-db
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: "16"
