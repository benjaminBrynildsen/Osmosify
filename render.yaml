services:
  - type: web
    name: osmosify
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: echo "STAGE_INSTALL" && npm ci --no-audit --no-fund --prefer-offline 2>&1 && echo "STAGE_BUILD" && npm run build 2>&1 && echo "STAGE_DONE"
    startCommand: npm run db:push && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: SESSION_SECRET
        generateValue: true
      # Neon Postgres — paste pooled connection string from Neon dashboard
      - key: DATABASE_URL
        sync: false
      # Google OAuth — fill these in via the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      # Cloudflare R2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: PUBLIC_OBJECT_PREFIX
        value: public
      - key: PRIVATE_OBJECT_PREFIX
        value: private
      # Gemini (direct)
      - key: GEMINI_API_KEY
        sync: false
      # Twilio (phone auth — optional)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
